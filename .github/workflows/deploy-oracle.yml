name: Build and Deploy Biblical Calendar (self-hosted arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: calendar-oracle-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, ARM64, oracle-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Build image natively (arm64)
        run: |
          docker build \
            -t calendar-app:latest \
            -t calendar-app:${{ github.sha }} \
            -f Dockerfile .

      - name: Sync deployment files to app dir
        run: |
          mkdir -p ~/apps/calendar
          cp docker-compose.app.yml ~/apps/calendar/docker-compose.app.yml

      - name: Deploy (biblicalcalendar.site)
        run: |
          cd ~/apps/calendar
          docker compose -f docker-compose.app.yml up -d

      - name: Prune dangling images
        run: docker image prune -f
